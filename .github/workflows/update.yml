name: Daily News Translation Update

on:
  schedule:
    - cron: '0 6 * * *' # يعمل تلقائياً كل يوم الساعة 6 صباحاً بتوقيت جرينتش
  workflow_dispatch: # يتيح لك تشغيله يدوياً متى شئت

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run translation script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      - name: Commit and push changes
        run: |
          git config --global user.name "Translation Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add news.json
          git commit -m "Daily news update [skip ci]" || exit 0
          git push
